[project]
name = "data-analytics"
version = "0.1.0"
description = "Data & analytics service for the OSN Informatika test-prep platform"
readme = "README.md"
authors = [
    { name = "razaq", email = "smknkepanjenkanesa@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.10",
    "pytest>=8.0",
    "httpx>=0.27.0",
]
ingest = [
    "huggingface-hub>=1.33.0",
    "onnxruntime>=1.30.0",
    "psutil>=7.2.2",
    "tokenizers>=0.23.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]

[[tool.mypy.overrides]]
# Hanya terpasang lewat dependency group `ingest` (lihat embedding.py).
module = ["onnxruntime", "onnxruntime.*", "tokenizers", "huggingface_hub", "psutil"]
ignore_missing_imports = true
